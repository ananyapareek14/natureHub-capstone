<div class="container mt-4">
  <div class="row">
    <div *ngFor="let remedy of remedies" class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ remedy.Name }}</h5>
          <p class="card-text">{{ remedy.Description }}</p>
          <button class="btn btn-primary" [routerLink]="['/remedies', remedy.Id]">Know More</button>
        </div>
      </div>
    </div>
  </div>
