<div class="remedy-detail-container"></div> <!-- ✅ Background container -->

<div class="container remedy-container">
  <h2 class="text-center section-title">Remedy Details</h2>

  <div class="remedy-card">
    <div class="remedy-header">
      <h5 class="remedy-title">{{ remedy?.Name }}</h5>
      <span class="category-badge">{{ remedy?.Category }}</span>
    </div>
    <hr>
    <div class="remedy-body">
      <p class="remedy-text"><strong>🌱 Description:</strong></p>
      <p class="para-text" [innerHTML]="formatText(remedy?.Description)"></p>

      <p class="remedy-text"><strong>🍃 Ingredients:</strong></p>
      <p class="para-text" >{{ remedy?.Ingredients }}</p>

      <p class="remedy-text"><strong>✨ Benefits:</strong></p>
      <p class="para-text" [innerHTML]="formatText(remedy?.Benefits)"></p>

      <p class="remedy-text"><strong>📝 Preparation:</strong></p>
      <p class="para-text" [innerHTML]="formatText(remedy?.PreparationMethod)"></p>

      <p class="remedy-text"><strong>💡 Usage:</strong></p>
      <p class="para-text" [innerHTML]="formatText(remedy?.UsageInstructions)"></p>

      <p class="para-text small">📅 Created on: {{ remedy?.CreatedDate | date:'MMM d, y' }}</p>
    </div>
  </div>
</div>
