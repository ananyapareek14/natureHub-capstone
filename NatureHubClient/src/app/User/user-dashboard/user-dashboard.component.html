<div class="container mt-5">
    <div *ngIf="isLoading" class="text-center">
      <app-loading-spinner></app-loading-spinner>
    </div>
  
    <div *ngIf="errorMessage" class="alert alert-danger text-center">
      {{ errorMessage }}
    </div>
  
    <div *ngIf="user && overview">
      <h2 class="text-center">Welcome, {{ user.Name }}!</h2>
      
      <div class="row mt-4">
        <!-- Profile Section -->
        <div class="col-md-4">
          <div class="card p-3 shadow">
            <h4>User Profile</h4>
            <p><strong>Email:</strong> {{ user.Email }}</p>
            <p><strong>Member Since:</strong> {{ user.CreatedAt | date }}</p>
          </div>
        </div>
  
        <!-- Overview Section -->
        <div class="col-md-8">
          <div class="card p-3 shadow">
            <h4>Dashboard Overview</h4>
            <ul class="list-group">
              <li class="list-group-item">Total Orders: {{ overview.TotalOrders }}</li>
              <li class="list-group-item">Total Spent: ${{ overview.TotalSpent }}</li>
              <li class="list-group-item">Cart Items: {{ overview.CartItemCount }}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
