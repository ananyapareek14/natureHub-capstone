<div class="container mt-4">
  <h2 class="mb-4">Checkout</h2>

  <div *ngIf="cartItems.length === 0" class="alert alert-info text-center">
    Your cart is empty.
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="list-group">
      <div class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of cartItems">
        <div>
          <h5>{{ item.Product.Name }}</h5>
          <p class="text-muted">₹ {{ item.Product.Price | number:'1.2-2' }}</p>
          <p>Quantity: {{ item.Quantity }}</p>
        </div>
      </div>
    </div>

    <div class="mt-4 d-flex justify-content-between">
      <h4>Total: ₹ {{ totalPrice | number:'1.2-2' }}</h4>
      <button class="btn btn-success" (click)="placeOrder()">Place Order</button>
    </div>
  </div>
</div>
