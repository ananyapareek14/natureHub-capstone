<div class="health-tips-list-container"></div>
<div class="health-tips-container">
  <!-- Section Title -->
  <h2 class="section-title">Health Tips</h2>

  <!-- Filter Buttons -->
  <div class="filter-section">
    <button
      *ngFor="let category of categories"
      class="filter-btn"
      [class.active]="selectedCategory === category"
      (click)="filterByCategory(category)"
    >
      {{ category }}
    </button>
    <button class="filter-btn reset" (click)="resetFilter()">All</button>
  </div>

  <!-- Grid-Based Tips Display -->
  <div class="grid-container">
    <div
      *ngFor="let tip of filteredHealthTips"
      class="health-card"
      (click)="viewDetails(tip.Id)"
    >
      <div class="card-header">
        <h5 class="tip-title">{{ tip.Title }}</h5>
        <span class="category-badge">{{ tip.Category }}</span>
      </div>
      <p class="tip-text">
        {{ tip.Content }} <!-- Show a short description -->
      </p>
    </div>
  </div>

  <!-- No Results Message -->
  <div *ngIf="filteredHealthTips.length === 0" class="alert alert-info">
    No health tips found for this category.
  </div>
</div>
