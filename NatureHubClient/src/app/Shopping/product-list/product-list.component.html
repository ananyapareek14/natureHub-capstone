<div class="product-list-container"></div>
<div class="container mt-4 product-container">
  <h2 class="text-center mb-4">Explore Products</h2>

  <div class="category-scroll-container">
    <div class="category-scroll">
      <div
        *ngFor="let category of categories"
        class="category-item"
        (click)="filterByCategory(category.name)"
      >
        <img [src]="category.image" [alt]="category.name" />
        <p>{{ category.name }}</p>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center">
    <app-loading-spinner></app-loading-spinner>
  </div>

  <div class="row justify-content-center">
    <div *ngFor="let product of filteredProducts" class="col-md-4 col-sm-6 col-12 mb-4">
      <div class="card product-card">
        <div class="product-image-container">
          <img [src]="product.ImageUrl" class="card-img-top" alt="{{ product.Name }}" />
        </div>
        <div class="card-body text-center">
          <h5 class="card-title">{{ product.Name }}</h5>
          <p class="card-text price">₹ {{ product.Price }}</p>
          <button class="btn btn-primary" (click)="viewProduct(product.Id)">View Details</button>
          <button class="btn btn-success ms-2" (click)="addToCart(product)">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>
